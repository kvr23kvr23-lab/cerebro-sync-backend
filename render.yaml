# Render Blueprint — one-click deploy of the Cerebro sync server + its database.
# In Render: New → Blueprint → pick the repo with this file → Apply.
# It provisions a PostgreSQL database and a web service, wires DATABASE_URL between them,
# generates a JWT secret, and seeds the first unit + login users on first start.
#
# The database runs on a paid plan (basic-256mb, ~$6–7/mo) so it is persistent and never
# expires. The web service stays on free (sleeps when idle; first request after a nap takes
# ~30–50s to wake) — switch it to a paid plan too if you want it always-on.

databases:
  - name: cerebro-db
    plan: basic-256mb

services:
  - type: web
    name: cerebro-sync
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cerebro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SEED_ON_START
        value: "1"
      # AI features (OCR, Draft, Discuss, literature). The VALUE is set in the Render
      # dashboard, never here — sync:false tells the blueprint to leave it alone and never
      # prune it on a re-sync. If AI returns 401 "invalid x-api-key", re-paste a valid key
      # from console.anthropic.com into this var in the dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
